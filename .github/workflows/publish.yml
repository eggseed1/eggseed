name: Publish eggseed
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the static Last.fm text once per hour.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eggseed-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify high-resolution ASCII maker
        run: |
          node --check ascii-maker.js
          node scripts/test-ascii-maker.cjs
      - name: Update recent Last.fm text
        env:
          LASTFM_USERNAME: ${{ vars.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python3 scripts/update_lastfm.py
      - name: Package static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
